##########################################
StartupConfiguration_DebugFlag=0x3
GlueLayer_ToolConfigSelection=1
#user_ports_tcp_name=Autotest
#user_ports_tcp_port=7555
debug_console=0
debug_device=1
debug_enable=1
debug_dir=/data/vendor/gps
gnss_data_dir=/data/vendor/gps
uni_log_max_size_mb=50
uni_log_max_file_count=19
uni_log_total_max_size_mb=950
# Remove SPOTLogger Thread
SpotLogger_Allowed=0
############################################
Sif_UseFwXtraInterface=0
#0 ? disables use of SGEE, 1 ? enables use of SGEE
Sif_OperationMode=1
Sif_HandleSgeeInCore=1

############################################

GlueLayer_YearOfHW=2021
GlueLayer_isForceIPV6=0
GlueLayer_EnableGnssCfgInterface=1
# Ignore Android Framework Requests to Enable SUPL
GlueLayer_EnableFwConfiguration=1
GlueLayer_LtsTimeGuard=2
GlueLayer_IsSlpIpCachingEnable=0
#(GLO CP enable :1 disable :0)
GlueLayer_IsCpGloAidingEnable=0
# 2G3G Enable
GlueLayer_Is3GCpEnable=1
#(LPP CP default bitmask, OTDOA disable)
GlueLayer_LPPCpBitmask=0x05
# NR LPP PROFILE
# GlueLayer_NrLPPCpBitmask=0xFF
#NFW permission for Emergency SUPL
GlueLayer_IsUseUeEmergencyMode=1
GlueLayer_IsUseNfwLocAccess=1
GlueLayer_IsUseNfwVCLocAccess=1
GlueLayer_IsAllowEmerNiInNonEmerState=0
GlueLayer_VcPkgNameCP=com.sec.location.nfwlocationprivacy
GlueLayer_VcPkgNameUP=com.sec.location.nfwlocationprivacy
#NFW rejection handling policy (when NFW denied, 1 : Empty Provide Cap reported, 0 : Provide Loc reported only for ECID, OTDOA)
GlueLayer_isCpNfwRejNwkResp=1
#LPPe configuration
GlueLayer_IsNLPInsideLppeEnable=0
GlueLayer_IsNLPInsideAgnssEnable=0
GlueLayer_IsNLPOnlyRetInfoRequestedEnable=0
#(SUPL1.0 disable-ATT only)
GlueLayer_IsAutoSuplNiVerEnable=0 
#Grace Period Time 5 minutes
GlueLayer_CpEmergRebidGracePeriodSec=300
GlueLayer_UpEmergRebidGracePeriodSec=0
#MO Request Acceptance
GlueLayer_IsMOReqIgnored=0
# request reference location to FW (always)
GlueLayer_isLocalRefLocInColdStart=2
#Swiching Mode enable(1)
#GlueLayer_isReqFwRefLocFromDBH=1
#GlueLayer_isReqDBHFromFwRefLoc=1
#(MEMS enable)
GlueLayer_IsMemsEnable=1

############################################

#(GPS/GLO/GAL/BDS SUPL aiding enable :1 disable :0)
Agnss_IsGpsAidingEnable=1
Agnss_IsGloAidingEnable=0
AGnss_IsGalAidingEnable=0
Agnss_IsBdsAidingEnable=0
Agnss_ReaidingInterval=7200
#(TLS1.0 setting)
Agnss_ShaVariant=256
Agnss_TlsVariant=0
#set APN through FW
Agnss_SuplUseApn=1
#set DNS lookup through FW
Agnss_SuplUseFwDns=0
#set APN when NI session through FW
Agnss_SuplUseApnNi=1
#retrying SUPL when connection failed, Enable : 1 disable : 0
Agnss_IsAggressiveSupl=0
# Multiple Location IDs
Agnss_IsSuplWlanAPEnable=0

############################################

Chip_Configuration_AidingConfiguration=0x00020046
#(Sampling Rate : Galileo 8MHz / Beidou 4MHz / Glonass 12MHz / GPS 2MHz)
# change GAL to 8M from 2M temporarily
Chip_Configuration_IspTestConfig=0x28242C22
#(both accelerometer and gyro) 
### Enable MEMS static detection and heading filter ###
Chip_Configuration_mems_data_Configuration=13
#(this conf need for 2Mhz control from FW)
Chip_Configuration_SendChipConfig=1
#HRC disable
Chip_Configuration_FeatureCfg_HRC=0
#To use Gyro-estimated heading
Chip_Configuration_GyroEstHdgOutputEna=1
# set shared reference clock for freq aiding (0x20) 
# enable dcxo (0x04)
Chip_Configuration_RefClkControl=0x24
# For disable Galileo when Band13/CP Mailbox (0x1) CP state reporting (0x2)
Chip_Configuration_IoReserved=3
### 2848 L1 MCW ###
#GPS_ENABLE 0x0001
#GLONASS_ENABLE 0x0002
#GALILEO_ENABLE 0x0004
#BEIDOU_ENABLE 0x0008
#SBAS_ENABLE 0x0010
#QZSS_ENABLE 0x0020
#NAVIC_ENABLE 0x0040
#L5_ENABLE 0x0080
#MEMS_STATIC_ENABLE 0x2000
#MEMS_HEADING_RATE_ENABLE 0x4000
Chip_Configuration_GNSSConstConstraintDef=0x601F
Chip_Configuration_RfMiscCtrl=0x80008001
LocTech_Constraints=0x601F

############################################

#CP GPS only
CP_LocTech_PrimaryConst=0x00
CP_LocTech_Constraints=0x0001
CP_LocTech_Requirements=0x0000
# 0:4G TX; 1:3G TX; 2:2G TX; 3:4G RX; 4:3G RX; 5:2G RX 65535:Tx/Rx blanking not in use
CPBlanking_RAT_A=0
# 0:Blanking Disabled; 1:Blanking Enable; 2:Blanking only on specified sub-band (specified in CPBlankingBand_ABC, up to 3 may be specified)
CPBlanking_State_A=2
# Band 14 for TX/RX blanking. Ignored unless CPBlankingState=2
CPBlanking_Band_A=14
# 0:4G TX; 1:3G TX; 2:2G TX; 3:4G RX; 4:3G RX; 5:2G RX 65535:Tx/Rx blanking not in use
CPBlanking_RAT_B=0
# 0:Blanking Disabled; 1:Blanking Enable; 2:Blanking only on specified sub-band (specified in CPBlankingBand_ABC, up to 3 may be specified)
CPBlanking_State_B=2
# Band 13 for TX/RX blanking. Ignored unless CPBlankingState=2
CPBlanking_Band_B=13

## Apply RF Loss value
RfPathLossDb_Ap=5
RfPathLossDb_Cp=5

# For HW Geofence
gf_enabled=0
gf_UnavailableTimer=30
gf_UnavailableTimeOutTime=420
notifResponsivenessMs=60000

# LPP HA GAD SHAPE
EnableLppHaGadShape=0

# UEB only mode enable for USA models (default =1)
SETCaps_Wcdma_InitReq=0
#(Canada : 0)
SETCaps_IsLpp=0
# SUPL OTDOA, Enable: 1 disable:0
SETCaps_IsOtdoa=0
# SUPL ECID, Enable: 1 disable:0
SETCaps_IsEcid=0
#IPC disabled from this value=0
SETCaps_UseRil=1
#(disable Autonomous SUPL)
SETCaps_IsAutonomous=0
# LPPe SUPL
#SETCaps_IsLppe=0

#OperationMode configurations for each band (all feature default value =1)
# 5G_CP_SETCaps_IsMSA=1
# 5G_CP_SETCaps_IsMSB=1
# 5G_CP_SETCaps_IsAutonomous=1
4G_CP_SETCaps_IsMSA=1
4G_CP_SETCaps_IsMSB=1
4G_CP_SETCaps_IsAutonomous=1
3G_CP_SETCaps_IsMSA=1
3G_CP_SETCaps_IsMSB=1
3G_CP_SETCaps_IsAutonomous=1
2G_CP_SETCaps_IsMSA=1
2G_CP_SETCaps_IsMSB=1
2G_CP_SETCaps_IsAutonomous=1

############################################



# Scheduling capability support
scheduling_enabled=1
#NTP request disable :0
UseNtpForAiding=0
#Last Known Location to Disabled
IsUseLastKnownLocEnable=0
# 0: No aiding 1: Local (lastKnownLocation) 2: Network (AGNSS)
Aiding_AidingType=2

IsUeInEmergency=0
# 0x001: Eanble StaticNavMode
# 0x002: Enable TunnelDetection
# 0x200: Enable MEMS S4
# 0x080: Enable velocity smoothing for weak signal cases.
#NavOptions=0x283
# allow BL to enable PBUS (required for PAMIR to branch to startup code in Ext Mem)
firmware_run_flags=0x28
#K040 : pamir, K050 : papaya, K057 : quartz
gnss_device_type=K057
### Specify RFIC ID for K57 ###
# 55205001 = S5525 (5502)  Default for K57
gnss_rfic_chip_id=55250001
#Not exist in NA config.
use_data_patch=2
# Enable SUPL Bigdata
# default 0x3FFF
# SLL_SUPL_NMEA_EN_MASK (SUPL Bigdata) 0x020000000
NmeaBitmask=0x20003FFF
#enables CP state logging; 0x81 is the default
Chip_Configuration_Io_Options=0x83
# Enable Assert CallBack
AssertBigData_Collect_Enable=1
